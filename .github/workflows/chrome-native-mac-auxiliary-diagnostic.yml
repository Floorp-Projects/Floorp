# SPDX-License-Identifier: MPL-2.0
name: Isolated current Mac native speech capability and waveform
on:
  push:
    branches: [codex/chrome-native-mac-crash-diagnostic]
    paths:
      - .github/workflows/chrome-native-mac-auxiliary-diagnostic.yml
      - .github/diagnostics/run-mac-auxiliary-diagnostic.py
      - .github/diagnostics/mac-auxiliary-capability-fixture.mts
      - .github/diagnostics/mac-auxiliary-waveform-analyzer.py
permissions:
  contents: read
  actions: read
concurrency:
  group: chrome-native-current-mac-auxiliary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: b781ab6b56fb6e41bd87eeba91221230daebb579
          path: candidate-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: "v2.9.6"
      - name: Install exact frozen candidate test dependencies
        id: dependencies
        working-directory: candidate-source
        run: deno install --frozen --allow-scripts
      - name: Prepare real macOS CoreAudio output
        shell: bash
        working-directory: candidate-source
        run: |
          brew install --cask blackhole-2ch
          brew install switchaudio-osx
          sudo killall coreaudiod || true
          for attempt in {1..30}; do
            if SwitchAudioSource -a -t output | grep -Fx 'BlackHole 2ch'; then break; fi
            sleep 1
          done
          SwitchAudioSource -s 'BlackHole 2ch' -t output
          mkdir -p _dist/chrome-runtime-tests
          brew info --json=v2 blackhole-2ch > _dist/chrome-runtime-tests/coreaudio-backend.json
          system_profiler SPAudioDataType
      - name: Authenticate current package and run reviewed capability fixture and waveform
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .github/diagnostics/run-mac-auxiliary-diagnostic.py
          --source-root candidate-source --artifact mac-auxiliary-artifact
          --application mac-auxiliary-application --output mac-auxiliary-output
      - name: Retain each original or corrected outcome separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current393243-mac-auxiliary-capability-diagnostic
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            mac-auxiliary-output/
            candidate-source/_dist/chrome-runtime-tests/mac-auxiliary393243/source/
            candidate-source/_dist/chrome-runtime-tests/mac-auxiliary393243/**/report.json
            candidate-source/_dist/chrome-runtime-tests/mac-auxiliary393243/**/browser.log
            candidate-source/_dist/chrome-runtime-tests/mac-auxiliary393243/**/modules/
            candidate-source/_dist/chrome-runtime-tests/mac-auxiliary393243/**/profile/user.js
            candidate-source/_dist/chrome-runtime-tests/mac-auxiliary393243/**/profile/compatibility.ini
            candidate-source/_dist/chrome-runtime-tests/mac-auxiliary393243/waveform/*.json
            candidate-source/_dist/chrome-runtime-tests/mac-auxiliary393243/waveform/*.ndjson
            candidate-source/_dist/chrome-runtime-tests/mac-auxiliary393243/waveform/*.pcm
            candidate-source/_dist/chrome-runtime-tests/mac-auxiliary393243/waveform/*.log
            candidate-source/_dist/chrome-runtime-tests/coreaudio-backend.json
