---
name: Native Cocoa cause component probe
run-name: Foundation cause probe / existing Runtime7dd source

'on':
  push:
    branches:
      - codex/mac-native-cocoa-probe-20261017

permissions:
  contents: read

concurrency:
  group: mac-native-cocoa-probe-20261017
  cancel-in-progress: false

jobs:
  cocoa-probe:
    if: >-
      github.repository == 'Floorp-Projects/Floorp' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/mac-native-cocoa-probe-20261017'
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/patches/floorp-runtime/native-diagnostics/
      - name: Compile and execute source-derived Foundation probe
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 .github/patches/floorp-runtime/native-diagnostics/cocoa_probe.py \
            --work "$RUNNER_TEMP/cocoa-probe" \
            --output "$RUNNER_TEMP/cocoa-probe-result.json"
      - name: Save bounded proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cocoa-cause-probe-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cocoa-probe-result.json
          if-no-files-found: error
          retention-days: 1
