# SPDX-License-Identifier: MPL-2.0
name: Isolated old native Mac startup crash diagnostic
on:
  push:
    branches: [codex/chrome-native-mac-crash-diagnostic]
    paths:
      - ".github/workflows/chrome-native-mac-crash-diagnostic.yml"
      - ".github/diagnostics/run-mac-startup-diagnostic.py"
      - ".github/diagnostics/collect-darwin-crashes.py"
permissions:
  contents: read
  actions: read
concurrency:
  group: chrome-native-old-mac-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: f7ef0b832d79ed793b16421914d579307f76271c
          path: candidate-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: "v2.9.6"
      - name: Install exact frozen candidate test dependencies
        id: dependencies
        working-directory: candidate-source
        run: deno install --frozen --allow-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        id: candidate
        with:
          repository: Floorp-Projects/Floorp
          run-id: "39303630826"
          name: chrome-native-mac
          github-token: ${{ github.token }}
          path: candidate-artifact
      - name: Prepare real macOS CoreAudio output
        if: ${{ always() && runner.os == 'macOS' && steps.candidate.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        shell: bash
        working-directory: candidate-source
        run: |
          brew install --cask blackhole-2ch
          brew install switchaudio-osx
          sudo killall coreaudiod || true
          for attempt in {1..30}; do
            if SwitchAudioSource -a -t output | grep -Fx 'BlackHole 2ch'; then break; fi
            sleep 1
          done
          SwitchAudioSource -s 'BlackHole 2ch' -t output
          mkdir -p _dist/chrome-runtime-tests
          brew info --json=v2 blackhole-2ch > _dist/chrome-runtime-tests/coreaudio-backend.json
          system_profiler SPAudioDataType
      - name: Observe unchanged original startup and conditional native backtrace
        run: >-
          python .github/diagnostics/run-mac-startup-diagnostic.py
          --source-root candidate-source --artifact candidate-artifact --output diagnostic-output
      - name: Retain isolated diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: old393036-mac-startup-crash-diagnostic
          if-no-files-found: warn
          path: |
            diagnostic-output/
            candidate-source/_dist/chrome-runtime-tests/mac-crash-diagnostic-original/
            candidate-source/_dist/chrome-runtime-tests/coreaudio-backend.json
