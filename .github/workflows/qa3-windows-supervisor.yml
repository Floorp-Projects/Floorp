# SPDX-License-Identifier: MPL-2.0
name: QA3 Windows supervisor

"on":
  pull_request:
    paths:
      - "tools/qa3/**"
      - ".github/workflows/qa3-windows-supervisor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-supervisor:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Report the Windows Python runtime
        run: python --version
      - name: Test the Job Object supervisor contracts
        run: |
          python -B -m unittest discover -s tools/qa3 -p "test_source_windows.py" -v
