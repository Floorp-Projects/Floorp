# SPDX-License-Identifier: MPL-2.0

name: "(A) |α| Publish Alpha"

on:
  workflow_call:
    inputs:
      bundle_artifact:
        description: Exact JSON identity of the signed bundle from this run
        type: string
        required: true
      installer_artifact_ids:
        description: Exact installer IDs from the assembled bundle
        type: string
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-alpha-${{ github.repository }}
  cancel-in-progress: false

jobs:
  final-package-qa:
    uses: ./.github/workflows/validate-final-package-qa.yml
    with:
      alpha: true
      package_run_id: ${{ github.run_id }}
      floorp_head_sha: ${{ github.sha }}
      bundle_artifact: ${{ inputs.bundle_artifact }}
      installer_artifact_ids: ${{ inputs.installer_artifact_ids }}

  main:
    needs: final-package-qa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Configure required reviewers for this environment in repository settings.
    environment: Deploy-to-installer-alpha
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Revalidate the QA bundle after approval
        id: bundle
        uses: actions/github-script@v7
        env:
          BUNDLE_ARTIFACT: ${{ inputs.bundle_artifact }}
        with:
          script: |
            const expected = JSON.parse(process.env.BUNDLE_ARTIFACT);
            const {data: artifact} = await github.rest.actions.getArtifact({
              ...context.repo, artifact_id: expected.id,
            });
            if (artifact.expired || artifact.name !== 'floorp-release-bundle-v2' ||
                artifact.digest !== expected.digest ||
                artifact.workflow_run?.id !== context.runId ||
                artifact.workflow_run?.head_sha !== context.sha) {
              throw new Error('The final QA bundle changed while waiting for approval');
            }
            core.setOutput('id', String(artifact.id));

      - name: Download the exact approved bundle
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.bundle.outputs.id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/floorp-release-bundle-v2
          merge-multiple: true

      - name: Validate the bundle and stage the Windows Alpha assets
        shell: bash
        env:
          BUNDLE_DIR: ${{ runner.temp }}/floorp-release-bundle-v2
          PUBLISH_DIR: ${{ runner.temp }}/noraneko-publish
        run: |
          set -euo pipefail
          deno run --allow-read tools/src/release_provenance.ts \
            validate-release-bundle --bundle-dir "$BUNDLE_DIR" --production
          mkdir "$PUBLISH_DIR"
          cp "$BUNDLE_DIR/floorp-windows-x86_64.installer.exe" \
            "$BUNDLE_DIR/floorp-windows-x86_64-full.mar" "$PUBLISH_DIR/"
          deno eval '
            import { generateUpdateXml } from "./tools/src/update.ts";
            generateUpdateXml(Deno.args[0], Deno.args[1], Deno.args[2]);
          ' "$BUNDLE_DIR/win-meta.json" "$PUBLISH_DIR/WINNT_x86_64-msvc-x64.update.xml" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/alpha/floorp-windows-x86_64-full.mar"

      - name: Deploy to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/noraneko-publish/*
          fail_on_unmatched_files: true
          tag_name: "alpha"
          target_commitish: ${{ github.sha }}
          name: "Alpha Release"
          body: "Noraneko Alpha for Windows"
          draft: false
          prerelease: true
          token: ${{ github.token }}

      # The release action only uses target_commitish when creating the tag.
      # Advance the rolling tag after the prerelease assets upload successfully.
      - name: Bind the rolling Alpha tag to the QA source
        uses: actions/github-script@v7
        with:
          script: |
            const ref = { ...context.repo, ref: 'tags/alpha' };
            const { data: current } = await github.rest.git.getRef(ref);
            if (current.object.type === 'commit' && current.object.sha === context.sha) return;

            const { data: updated } = await github.rest.git.updateRef({
              ...ref, sha: context.sha, force: true,
            });
            if (updated.object.type !== 'commit' || updated.object.sha !== context.sha) {
              throw new Error('The rolling Alpha tag does not point to the QA source');
            }

      - name: Upload published Alpha assets
        uses: actions/upload-artifact@v4
        with:
          name: noraneko-publish
          path: ${{ runner.temp }}/noraneko-publish/*
