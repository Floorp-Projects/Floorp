name: Native Mozilla browser + xpcshell pilot (NO Marionette)

# Temporary exact-PR pilot; no pull_request_target, fork execution or publication.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: native-browser-xpcshell-pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  execute:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'Floorp-Projects/Floorp' &&
      github.event.pull_request.number == 3138 &&
      github.event.pull_request.head.repo.full_name == 'Floorp-Projects/Floorp' &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.ref == 'qa/mozilla-native-product-pilot' &&
      github.event.pull_request.base.repo.full_name == 'Floorp-Projects/Floorp' &&
      github.event.pull_request.base.ref == 'main'
    name: Linux x64 browser + xpcshell pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Contract test dependency
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Validate contract implementation (not native test evidence)
        run: python3 -m unittest discover -s tools/qa/native-product-ci -v
      - name: Resolve exact PR head and lock-derived Runtime
        id: pins
        run: python3 tools/qa/native-product-ci/pr_inputs.py
      - uses: actions/checkout@v4
        with:
          repository: Floorp-Projects/Floorp-Runtime
          ref: ${{ steps.pins.outputs.runtime_sha }}
          path: runtime
          submodules: recursive
          persist-credentials: false
      - name: Verify locked Runtime source tree and version
        env:
          EXPECTED_TREE: ${{ steps.pins.outputs.runtime_tree }}
          EXPECTED_VERSION: ${{ steps.pins.outputs.runtime_version }}
        run: |
          test "$(git -C runtime rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(tr -d '\r\n' < runtime/browser/config/version.txt)" = "$EXPECTED_VERSION"
      - uses: actions/checkout@v4
        with:
          repository: Floorp-Projects/Floorp
          ref: ${{ steps.pins.outputs.floorp_sha }}
          path: runtime/noraneko
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 'latest'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml msitools jq patchelf xvfb mesa-utils rsync
      - name: Build and assemble finalized native product on this worker
        env:
          FLOORP_SHA: ${{ steps.pins.outputs.floorp_sha }}
          RUNTIME_SHA: ${{ steps.pins.outputs.runtime_sha }}
        run: |
          python3 tools/qa/native-product-ci/build_worker.py \
            --runtime "$GITHUB_WORKSPACE/runtime" \
            --output "$RUNNER_TEMP/native-provisioned" \
            --floorp-sha "$FLOORP_SHA" --runtime-sha "$RUNTIME_SHA"
      - name: Resolve native browser and xpcshell schedules before test execution
        env:
          FLOORP_SHA: ${{ steps.pins.outputs.floorp_sha }}
          RUNTIME_SHA: ${{ steps.pins.outputs.runtime_sha }}
        run: |
          python3 tools/qa/native-product-ci/resolve_native.py \
            --cohort "$RUNNER_TEMP/native-provisioned/cohort.json" \
            --output "$RUNNER_TEMP/native-provisioned"
      - name: Execute authenticated product cohort
        env:
          FLOORP_SHA: ${{ steps.pins.outputs.floorp_sha }}
          RUNTIME_SHA: ${{ steps.pins.outputs.runtime_sha }}
        run: |
          # A reviewed build/provisioning step must create this on THIS worker.
          # Do not relocate an OBJDIR or use a Runtime-only product as a shortcut.
          provision="$RUNNER_TEMP/native-provisioned"
          for item in cohort.json plan.json plan.sha256; do
            if [ ! -f "$provision/$item" ]; then
              echo "::error::BLOCKED: complete same-worker native build/provisioning is not integrated ($item missing). No tests ran."
              exit 2
            fi
          done
          python3 tools/qa/native-product-ci/ci-adapter.py --scope browser-xpcshell \
            --evidence "$RUNNER_TEMP/native-evidence" \
            --cohort "$provision/cohort.json" \
            --plan "$provision/plan.json" \
            --plan-sha256 "$(cat "$provision/plan.sha256")"
      - name: Retain build receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-provisioned/*.json
            ${{ runner.temp }}/native-provisioned/*.log
            ${{ runner.temp }}/native-provisioned/recipe/
            ${{ runner.temp }}/native-provisioned/resolver/
          if-no-files-found: error
          retention-days: 14
      - name: Retain native evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-evidence/
          if-no-files-found: error
          retention-days: 14

  gate:
    name: Mozilla browser + xpcshell pilot / gate
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.repository == 'Floorp-Projects/Floorp' &&
      github.event.pull_request.number == 3138 &&
      github.event.pull_request.head.repo.full_name == 'Floorp-Projects/Floorp' &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.ref == 'qa/mozilla-native-product-pilot' &&
      github.event.pull_request.base.repo.full_name == 'Floorp-Projects/Floorp' &&
      github.event.pull_request.base.ref == 'main'
    needs: [execute]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Reject skipped, incomplete, or failed native execution
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 tools/qa/native-product-ci/gate.py --scope browser-xpcshell --needs "$NEEDS_JSON" --evidence evidence
