# SPDX-License-Identifier: MPL-2.0

name: Validate final Floorp package regressions

"on":
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Successful normal Package and Publish Release run
        required: true
        type: string
      floorp_head_sha:
        description: Exact Floorp source commit recorded by that package run
        required: true
        type: string
      validation_only:
        description: Select the normal pipeline's unsigned validation artifacts
        required: false
        type: boolean
        default: true
      pre_publication:
        description: Verify signed packages awaiting protected public release approval
        required: false
        type: boolean
        default: false
      linux_l2_blacksmith:
        description: Observe only the two Linux x64 production probes on the existing Blacksmith label (no publication)
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  l2-selection:
    if: inputs.linux_l2_blacksmith == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Reject unsigned or repeated L2 selection before allocating Blacksmith
        uses: actions/github-script@v7
        env:
          UNSIGNED: ${{ inputs.validation_only }}
          PACKAGE_RUN: ${{ inputs.package_run_id }}
          FLOORP_HEAD: ${{ inputs.floorp_head_sha }}
          PRE_PUBLICATION: ${{ inputs.pre_publication }}
        with:
          script: |
            const {validateSourceIdentity,validateFinalPackageSource} = await import(
              `file://${process.env.GITHUB_WORKSPACE}/tools/final-package-qa-source.mjs`);
            if (process.env.UNSIGNED !== 'false' || process.env.GITHUB_RUN_ATTEMPT !== '1' ||
                !/^[1-9][0-9]*$/.test(process.env.PACKAGE_RUN || '') ||
                !Number.isSafeInteger(Number(process.env.PACKAGE_RUN)) ||
                !/^[0-9a-f]{40}$/.test(process.env.FLOORP_HEAD || '')) {
              throw new Error('Linux L2 requires production inputs and original consumer attempt 1');
            }
            const {data: run} = await github.rest.actions.getWorkflowRun(
              {...context.repo,run_id:Number(process.env.PACKAGE_RUN)});
            validateSourceIdentity(run,process.env.FLOORP_HEAD);
            if (run.run_attempt !== 1) throw new Error('Original package attempt 1 required');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt,
              {...context.repo,run_id:run.id,attempt_number:1,per_page:100});
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {...context.repo,run_id:run.id,per_page:100});
            let extra = {};
            if (process.env.PRE_PUBLICATION === 'true') {
              const {data: pendingDeployments} = await github.rest.actions.getPendingDeploymentsForRun(
                {...context.repo,run_id:run.id});
              const {data: pkg} = await github.rest.repos.getContent(
                {...context.repo,path:'package.json',ref:run.head_sha});
              const version = JSON.parse(Buffer.from(pkg.content,'base64').toString()).version;
              if (!/^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$/.test(version || '')) {
                throw new Error('Invalid production version');
              }
              let release = null;
              try { ({data: release} = await github.rest.repos.getReleaseByTag(
                {...context.repo,tag:`v${version}`})); }
              catch (error) { if (error.status !== 404) throw error; }
              extra = {pendingDeployments,release,
                bundleArtifacts:artifacts.filter(artifact => artifact.name === 'floorp-release-bundle-v2')};
            }
            validateFinalPackageSource({run,headSha:process.env.FLOORP_HEAD,jobs,
              prePublication:process.env.PRE_PUBLICATION === 'true',unsigned:false,...extra});
            for (const name of ['noraneko-linux-x86_64-installer',
                                'floorp-native-verification-linux-x86_64-v2']) {
              const found = artifacts.filter(artifact => artifact.name === name && artifact.expired === false);
              if (found.length !== 1 || !Number.isSafeInteger(found[0].id) || found[0].id <= 0 ||
                  !/^sha256:[0-9a-f]{64}$/.test(found[0].digest || '') ||
                  found[0].workflow_run?.id !== run.id || found[0].workflow_run?.head_sha !== run.head_sha) {
                throw new Error('Missing original production Linux artifact metadata');
              }
            }

  final-package:
    needs: l2-selection
    if: ${{ always() && !cancelled() && (!inputs.linux_l2_blacksmith || needs.l2-selection.result == 'success') }}
    name: Final package QA / ${{ matrix.platform }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    outputs:
      evidence_id: ${{ steps.evidence.outputs.artifact-id }}
    concurrency:
      group: ${{ inputs.linux_l2_blacksmith && format('qa3-l2-{0}-{1}-{2}', github.repository_id, inputs.package_run_id, inputs.floorp_head_sha) || format('final-qa-{0}-{1}-{2}', github.run_id, matrix.platform, matrix.arch) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.linux_l2_blacksmith && '{"include":[{"platform":"linux","arch":"x86_64","runner":"blacksmith-8vcpu-ubuntu-2404","package":"noraneko-linux-x86_64-installer","file":"floorp-linux-x86_64.tar.xz"}]}' || '{"include":[{"platform":"linux","arch":"x86_64","runner":"ubuntu-24.04","package":"noraneko-linux-x86_64-installer","file":"floorp-linux-x86_64.tar.xz"},{"platform":"mac","arch":"x86_64","runner":"macos-15-intel","package":"noraneko-mac-universal-installer","file":"floorp-macOS-universal.dmg"},{"platform":"mac","arch":"aarch64","runner":"macos-14","package":"noraneko-mac-universal-installer","file":"floorp-macOS-universal.dmg"}]}') }}
    steps:
      - name: Checkout regression probes
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Authenticate the normal package run and exact artifacts
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.package_run_id }}
          FLOORP_HEAD_SHA: ${{ inputs.floorp_head_sha }}
          VALIDATION_ONLY: ${{ inputs.validation_only }}
          PRE_PUBLICATION: ${{ inputs.pre_publication }}
          LINUX_L2: ${{ inputs.linux_l2_blacksmith }}
          PACKAGE_NAME: ${{ matrix.package }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const {validateSourceIdentity,validateFinalPackageSource} = await import(
              `file://${process.env.GITHUB_WORKSPACE}/tools/final-package-qa-source.mjs`);
            if (!/^[1-9][0-9]*$/.test(process.env.SOURCE_RUN_ID || '') ||
                !Number.isSafeInteger(Number(process.env.SOURCE_RUN_ID)) ||
                !/^[0-9a-f]{40}$/.test(process.env.FLOORP_HEAD_SHA || '') ||
                !['true', 'false'].includes(process.env.VALIDATION_ONLY) ||
                !['true', 'false'].includes(process.env.PRE_PUBLICATION)) {
              throw new Error('Invalid immutable package input');
            }
            const runId = Number(process.env.SOURCE_RUN_ID);
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
            validateSourceIdentity(run,process.env.FLOORP_HEAD_SHA);
            if (process.env.LINUX_L2 === 'true' && run.run_attempt !== 1) {
              throw new Error('Original package attempt changed before intake');
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
              {...context.repo, run_id: runId, per_page: 100});
            for (const target of ['windows/x86_64', 'linux/x86_64', 'linuxAarch64/aarch64',
                                  'mac/x86_64', 'mac/aarch64']) {
              if (!jobs.some(job => job.conclusion === 'success' &&
                  job.name.includes(`Verify ${target} package`))) {
                throw new Error(`Missing successful final native gate: ${target}`);
              }
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {...context.repo, run_id: runId, per_page: 100});
            const {data: sourcePackage} = await github.rest.repos.getContent({
              ...context.repo, path:'package.json', ref:run.head_sha});
            const {data: sourceLock} = await github.rest.repos.getContent({
              ...context.repo, path:'floorp-runtime.lock.json', ref:run.head_sha});
            const version = JSON.parse(Buffer.from(sourcePackage.content, 'base64').toString()).version;
            const lock = JSON.parse(Buffer.from(sourceLock.content, 'base64').toString());
            if (!/^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$/.test(version || '') ||
                lock.schemaVersion !== 1 || !Array.isArray(lock.artifacts)) {
              throw new Error('Invalid version metadata at the exact package source');
            }
            const runtimePlatform = process.env.TARGET_PLATFORM === 'mac' ? 'macos' : process.env.TARGET_PLATFORM;
            const runtimeArch = process.env.TARGET_PLATFORM === 'mac' ? 'universal' : process.env.TARGET_ARCH;
            const runtimes = lock.artifacts.filter(artifact =>
              artifact.platform === runtimePlatform && artifact.architecture === runtimeArch);
            if (runtimes.length !== 1 ||
                !/^[0-9]+(?:\.[0-9]+){1,3}(?:[ab][0-9]+|esr)?$/.test(runtimes[0].version || '') ||
                !/^[0-9]{14}$/.test(runtimes[0].buildId || '')) {
              throw new Error('Missing unique pinned Runtime version and BuildID for this target');
            }
            const {version: firefoxVersion, buildId: runtimeBuildId} = runtimes[0];
            let prePublicationEvidence = {};
            if (process.env.PRE_PUBLICATION === 'true') {
              const {data: pendingDeployments} = await github.rest.actions.getPendingDeploymentsForRun(
                {...context.repo, run_id: runId});
              let release = null;
              try {
                ({data: release} = await github.rest.repos.getReleaseByTag(
                  {...context.repo, tag:`v${version}`}));
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              prePublicationEvidence = {pendingDeployments,release,
                bundleArtifacts:artifacts.filter(artifact => artifact.name === 'floorp-release-bundle-v2')};
            }
            const sourceEligibility = validateFinalPackageSource({run,
              headSha:process.env.FLOORP_HEAD_SHA,jobs,
              prePublication:process.env.PRE_PUBLICATION === 'true',
              unsigned:process.env.VALIDATION_ONLY === 'true',...prePublicationEvidence});
            const packageName = process.env.PACKAGE_NAME +
              (process.env.VALIDATION_ONLY === 'true' ? '-unsigned' : '');
            const recordName = `floorp-native-verification-${process.env.TARGET_PLATFORM}-${process.env.TARGET_ARCH}-v2`;
            const selected = {};
            for (const [kind, name] of [['package', packageName], ['record', recordName]]) {
              const matches = artifacts.filter(artifact => artifact.name === name && !artifact.expired);
              if (matches.length !== 1 || !/^sha256:[0-9a-f]{64}$/.test(matches[0].digest || '') ||
                  matches[0].workflow_run.id !== runId || matches[0].workflow_run.head_sha !== run.head_sha) {
                throw new Error(`Missing or ambiguous authenticated ${name}`);
              }
              const artifact = matches[0];
              const response = await github.rest.actions.downloadArtifact(
                {...context.repo, artifact_id: artifact.id, archive_format: 'zip'});
              const bytes = Buffer.from(response.data);
              const digest = 'sha256:' + crypto.createHash('sha256').update(bytes).digest('hex');
              if (digest !== artifact.digest) throw new Error(`Downloaded ${name} digest mismatch`);
              fs.writeFileSync(path.join(process.env.RUNNER_TEMP, `${kind}.zip`), bytes);
              selected[kind] = {id:artifact.id, name, digest};
            }
            fs.mkdirSync(path.join(process.env.RUNNER_TEMP, 'final-package-qa'));
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'final-package-qa/input.json'),
              JSON.stringify({runId, sourceAttempt:run.run_attempt, floorpHead:run.head_sha, floorpVersion:version,
                firefoxVersion, runtimeBuildId,
                sourceEligibility, probeHead:context.sha,
                platform:process.env.TARGET_PLATFORM, arch:process.env.TARGET_ARCH,
                unsigned:process.env.VALIDATION_ONLY === 'true', ...selected}, null, 2));

      - name: Validate the native record and extract the exact package
        shell: bash
        env:
          PACKAGE_FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import zipfile

          root = Path(os.environ['RUNNER_TEMP'])
          expected = json.loads((root / 'final-package-qa/input.json').read_text())
          with zipfile.ZipFile(root / 'record.zip') as archive:
              if archive.namelist() != ['native-verification.json']:
                  raise ValueError('Unexpected native record ZIP contents')
              record = json.loads(archive.read('native-verification.json'))
          if (record['schema_version'] != 2 or record['verification']['status'] != 'verified' or
              record['floorp']['head_sha'] != expected['floorpHead'] or
              record['floorp']['workflow_run_id'] != expected['runId'] or
              record['floorp']['repository'] != 'Floorp-Projects/Floorp' or
              record['target_key'] != expected['platform'] or record['native_arch'] != expected['arch'] or
              record['firefox_version'] != expected['firefoxVersion'] or
              record['runtime']['expected_build_id'] != expected['runtimeBuildId'] or
              record['app_build_id'] != expected['runtimeBuildId'] or
              record['platform_build_id'] != expected['runtimeBuildId'] or
              record['floorp_package'] != {
                  'artifact_id': expected['package']['id'],
                  'artifact_name': expected['package']['name'],
                  'artifact_digest': expected['package']['digest'],
                  'unsigned': expected['unsigned'],
              }):
              raise ValueError('Final native record does not bind this exact package/source')
          with Path(os.environ['GITHUB_ENV']).open('a') as output:
              output.write(f"QA_FLOORP_VERSION={expected['floorpVersion']}\n")
              output.write(f"QA_FIREFOX_VERSION={expected['firefoxVersion']}\n")
          (root / 'final-package-qa/native-verification.json').write_text(json.dumps(record, indent=2) + '\n')
          with zipfile.ZipFile(root / 'package.zip') as archive:
              if archive.namelist() != [os.environ['PACKAGE_FILE']]:
                  raise ValueError('Unexpected final package ZIP contents')
              archive.extract(os.environ['PACKAGE_FILE'], root / 'package')
          PY

      - name: Set up the Linux display and extract the package
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tarfile

          root = Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(root / 'package/floorp-linux-x86_64.tar.xz') as archive:
              archive.extractall(root / 'browser', filter='data')
          binaries = [file for file in (root / 'browser').rglob('floorp') if file.is_file()]
          if len(binaries) != 1:
              raise ValueError('Expected exactly one final Floorp executable')
          with Path(os.environ['GITHUB_ENV']).open('a') as output:
              output.write(f'QA_BROWSER={binaries[0]}\n')
          PY
          command -v Xvfb
          Xvfb :99 -nolisten tcp -screen 0 1280x1024x24 > "$RUNNER_TEMP/final-package-qa/xvfb.log" 2>&1 &
          for attempt in {1..50}; do
            [[ -S /tmp/.X11-unix/X99 ]] && break
            sleep 0.1
          done
          test -S /tmp/.X11-unix/X99
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"

      - name: Stage a disposable macOS test copy
        if: matrix.platform == 'mac'
        shell: bash
        env:
          UNSIGNED_PACKAGE: ${{ inputs.validation_only }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package-mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/package-mount" \
            "$RUNNER_TEMP/package/floorp-macOS-universal.dmg"
          trap 'hdiutil detach "$RUNNER_TEMP/package-mount" || true' EXIT
          python3 - <<'PY'
          import ctypes
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          root = Path(os.environ['RUNNER_TEMP'])
          apps = list((root / 'package-mount').glob('*.app'))
          if len(apps) != 1:
              raise ValueError('Expected exactly one final Floorp application')
          app = root / 'Floorp-final-qa.app'
          subprocess.run(['ditto', str(apps[0]), str(app)], check=True)
          copied = {}
          for path in apps[0].rglob('*'):
              if not path.is_file() or path.is_symlink():
                  continue
              relative = path.relative_to(apps[0])
              with path.open('rb') as stream:
                  before = hashlib.file_digest(stream, 'sha256').hexdigest()
              with (app / relative).open('rb') as stream:
                  after = hashlib.file_digest(stream, 'sha256').hexdigest()
              if before != after:
                  raise ValueError(f'Disposable copy changed {relative}')
              copied[str(relative)] = before
          removed = []
          for path in [app, *app.rglob('*')] if os.environ['UNSIGNED_PACKAGE'] == 'true' else []:
              if path.is_symlink():
                  continue
              for attribute in subprocess.check_output(['xattr', str(path)], text=True).splitlines():
                  if attribute in {'com.apple.FinderInfo', 'com.apple.ResourceFork'}:
                      subprocess.run(['xattr', '-d', attribute, str(path)], check=True)
                      removed.append({'path':str(path.relative_to(app)), 'attribute':attribute})
          evidence = root / 'final-package-qa'
          (evidence / 'development-copy.json').write_text(json.dumps({
              'filesBeforeDevelopmentSigning':copied, 'removedMetadata':removed,
              'sourceArtifactUnmodified':True,
          }, indent=2) + '\n')
          graphics = ctypes.CDLL('/System/Library/Frameworks/CoreGraphics.framework/CoreGraphics')
          graphics.CGPreflightPostEventAccess.restype = ctypes.c_bool
          graphics.CGPreflightScreenCaptureAccess.restype = ctypes.c_bool
          permissions = {'eventPosting':bool(graphics.CGPreflightPostEventAccess()),
                         'screenCapture':bool(graphics.CGPreflightScreenCaptureAccess()),
                         'permissionPromptOpened':False}
          (evidence / 'gui-permissions.json').write_text(json.dumps(permissions, indent=2) + '\n')
          if not permissions['eventPosting'] or not permissions['screenCapture']:
              raise RuntimeError('Required existing GUI permissions are unavailable')
          PY
          if [[ "$UNSIGNED_PACKAGE" == 'true' ]]; then
            codesign --force --deep --sign - --timestamp=none "$RUNNER_TEMP/Floorp-final-qa.app"
          fi
          codesign --verify --deep --strict "$RUNNER_TEMP/Floorp-final-qa.app"
          codesign --display --verbose=4 "$RUNNER_TEMP/Floorp-final-qa.app" \
            > "$RUNNER_TEMP/final-package-qa/development-signature.txt" 2>&1
          echo "QA_BROWSER=$RUNNER_TEMP/Floorp-final-qa.app" >> "$GITHUB_ENV"

      - name: Verify shipped Web Panel HTTP User-Agent behavior
        timeout-minutes: 10
        shell: bash
        env:
          LINUX_L2: ${{ inputs.linux_l2_blacksmith }}
        run: |
          set -euo pipefail
          launch=(python3)
          if [[ "$LINUX_L2" == true ]]; then
            mkdir -m 700 "$RUNNER_TEMP/l2-ua-home" "$RUNNER_TEMP/l2-ua-tmp"
            launch=(env -i PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 PYTHONNOUSERSITE=1
              HOME="$RUNNER_TEMP/l2-ua-home" TMPDIR="$RUNNER_TEMP/l2-ua-tmp" DISPLAY="${DISPLAY:?}")
            launch+=(python3)
          fi
          "${launch[@]}" tools/test-final-web-panel-ua.py --browser "$QA_BROWSER" \
            --native-record "$RUNNER_TEMP/final-package-qa/native-verification.json" \
            --expected-floorp-version "$QA_FLOORP_VERSION" --expected-firefox-version "$QA_FIREFOX_VERSION" \
            --output "$RUNNER_TEMP/final-package-qa/web-panel-ua"

      - name: Verify shipped Fluent lookup and Flasco context-menu availability
        if: inputs.validation_only == false
        timeout-minutes: 10
        shell: bash
        env:
          LINUX_L2: ${{ inputs.linux_l2_blacksmith }}
        run: |
          set -euo pipefail
          launch=(python3)
          if [[ "$LINUX_L2" == true ]]; then
            mkdir -m 700 "$RUNNER_TEMP/l2-fluent-home" "$RUNNER_TEMP/l2-fluent-tmp"
            launch=(env -i PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 PYTHONNOUSERSITE=1
              HOME="$RUNNER_TEMP/l2-fluent-home" TMPDIR="$RUNNER_TEMP/l2-fluent-tmp" DISPLAY="${DISPLAY:?}")
            launch+=(python3)
          fi
          "${launch[@]}" tools/test-final-context-menu.py --browser "$QA_BROWSER" \
            --native-record "$RUNNER_TEMP/final-package-qa/native-verification.json" \
            --expected-floorp-version "$QA_FLOORP_VERSION" --expected-firefox-version "$QA_FIREFOX_VERSION" \
            --output "$RUNNER_TEMP/final-package-qa/fluent-flasco"

      - name: Verify final macOS PWA context menus and native GUI input
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/app-shim/test-context-menu.py --browser "$QA_BROWSER" \
            --output "$RUNNER_TEMP/final-package-qa/context-menu" --iterations 20
          python3 tools/app-shim/test-runtime.py --browser "$QA_BROWSER" \
            --output "$RUNNER_TEMP/final-package-qa/native-gui" --launch-services --capture-window

      - name: Verify the source still awaits publication after GUI QA
        if: inputs.pre_publication == true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const {validateFinalPackageSource} = await import(
              `file://${process.env.GITHUB_WORKSPACE}/tools/final-package-qa-source.mjs`);
            const inputPath = path.join(process.env.RUNNER_TEMP,'final-package-qa/input.json');
            const input = JSON.parse(fs.readFileSync(inputPath,'utf8'));
            const {data: run} = await github.rest.actions.getWorkflowRun(
              {...context.repo,run_id:input.runId});
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
              {...context.repo,run_id:input.runId,per_page:100});
            const {data: pendingDeployments} = await github.rest.actions.getPendingDeploymentsForRun(
              {...context.repo,run_id:input.runId});
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {...context.repo,run_id:input.runId,per_page:100});
            let release = null;
            try {
              ({data: release} = await github.rest.repos.getReleaseByTag(
                {...context.repo,tag:`v${input.floorpVersion}`}));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const after = validateFinalPackageSource({run,headSha:input.floorpHead,jobs,
              prePublication:true,unsigned:input.unsigned,pendingDeployments,release,
              bundleArtifacts:artifacts.filter(a => a.name === 'floorp-release-bundle-v2')});
            if (JSON.stringify(after) !== JSON.stringify(input.sourceEligibility)) {
              throw new Error('The immutable bundle or publication approval state changed during QA');
            }
            // This read-only attestation is not a publisher dependency or lock.
            // The owner's existing publication approval remains a separate action.
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'final-package-qa/source-after-qa.json'),
              JSON.stringify({sourceEligibility:after,checkedAt:new Date().toISOString()},null,2));

      - name: Upload compact final package regression evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-package-qa-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/final-package-qa/*.json
            ${{ runner.temp }}/final-package-qa/*.txt
            ${{ runner.temp }}/final-package-qa/web-panel-ua/run-*/report.json
            ${{ runner.temp }}/final-package-qa/web-panel-ua/run-*/browser.log
            ${{ runner.temp }}/final-package-qa/web-panel-ua/run-*/browser.stdout.log
            ${{ runner.temp }}/final-package-qa/web-panel-ua/run-*/browser.stderr.log
            ${{ runner.temp }}/final-package-qa/web-panel-ua/run-*/browser-window.png
            ${{ runner.temp }}/final-package-qa/fluent-flasco/run-*/report.json
            ${{ runner.temp }}/final-package-qa/fluent-flasco/run-*/browser.log
            ${{ runner.temp }}/final-package-qa/fluent-flasco/run-*/browser.stdout.log
            ${{ runner.temp }}/final-package-qa/fluent-flasco/run-*/browser.stderr.log
            ${{ runner.temp }}/final-package-qa/context-menu/run-*/result.json
            ${{ runner.temp }}/final-package-qa/context-menu/run-*/browser.log
            ${{ runner.temp }}/final-package-qa/native-gui/run-*/report.json
            ${{ runner.temp }}/final-package-qa/native-gui/run-*/fixture-window.png
          if-no-files-found: error
          retention-days: 14

  linux-l2-observation:
    name: Observe original Linux L2 outcome (no publication)
    if: ${{ always() && inputs.linux_l2_blacksmith == true }}
    needs: [l2-selection, final-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retain original provider metadata and exact raw artifact
        uses: actions/github-script@v7
        env:
          RAW_ARTIFACT: ${{ needs.final-package.outputs.evidence_id }}
          PACKAGE_RUN: ${{ inputs.package_run_id }}
          FLOORP_HEAD: ${{ inputs.floorp_head_sha }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const errors = [];
            async function observe(name, action) {
              try { return await action(); }
              catch (error) { errors.push(`${name}: ${error.status || 'unavailable'}`); return null; }
            }
            const current = await observe('consumer', async () =>
              (await github.rest.actions.getWorkflowRun({...context.repo,run_id:context.runId})).data);
            const originalJobs = await observe('original consumer jobs', () => github.paginate(
              github.rest.actions.listJobsForWorkflowRunAttempt,
              {...context.repo,run_id:context.runId,attempt_number:1,per_page:100}));
            const packageRunId = Number(process.env.PACKAGE_RUN);
            const packageRun = await observe('package', async () =>
              (await github.rest.actions.getWorkflowRun({...context.repo,run_id:packageRunId})).data);
            const packageJobs = await observe('original package jobs', () => github.paginate(
              github.rest.actions.listJobsForWorkflowRunAttempt,
              {...context.repo,run_id:packageRunId,attempt_number:1,per_page:100}));
            const packageArtifacts = await observe('package artifacts', () => github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {...context.repo,run_id:packageRunId,per_page:100}));
            const rawId = Number(process.env.RAW_ARTIFACT);
            const rawArtifact = Number.isSafeInteger(rawId) && rawId > 0 ?
              await observe('raw artifact', async () =>
                (await github.rest.actions.getArtifact({...context.repo,artifact_id:rawId})).data) : null;
            if (!rawArtifact) errors.push('original raw artifact missing');
            const rawMatches = rawArtifact && rawArtifact.id === rawId && rawArtifact.expired === false &&
              Number.isSafeInteger(rawArtifact.size_in_bytes) && rawArtifact.size_in_bytes > 0 &&
              rawArtifact.size_in_bytes <= 64 * 1024 * 1024 &&
              rawArtifact.name === `final-package-qa-linux-x86_64-${context.runId}-1` &&
              rawArtifact.workflow_run?.id === context.runId && rawArtifact.workflow_run?.head_sha === context.sha &&
              /^sha256:[0-9a-f]{64}$/.test(rawArtifact.digest || '');
            if (rawArtifact && !rawMatches) errors.push('original raw artifact identity mismatch');
            if (rawMatches) {
              const downloaded = await observe('raw bytes', async () =>
                (await github.rest.actions.downloadArtifact(
                  {...context.repo,artifact_id:rawId,archive_format:'zip'})).data);
              if (downloaded) {
                const bytes = Buffer.from(downloaded);
                if (bytes.length !== rawArtifact.size_in_bytes) errors.push('original raw byte size mismatch');
                else fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'l2-original.zip'),bytes);
              }
            }
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'l2-context.json'),JSON.stringify({
              selection:{executionRunId:context.runId,executionAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),
                packageRunId,floorpHead:process.env.FLOORP_HEAD,probeHead:context.sha},
              run:current,originalJobs,packageRun,packageJobs,packageArtifacts,
              rawArtifact,rawArtifactIdExpected:rawId,collectionErrors:errors},null,2));
      - name: Observe both probes without promoting publication or Agent qualification
        if: always()
        run: |
          python3 -B tools/linux-l2/collect.py --context "$RUNNER_TEMP/l2-context.json" \
            --archive "$RUNNER_TEMP/l2-original.zip" --output "$RUNNER_TEMP/l2-observation"
      - name: Retain scoped observation including BLOCK or FAIL
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa3-linux-l2-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/l2-context.json
            ${{ runner.temp }}/l2-observation/observation.json
          if-no-files-found: error
          retention-days: 14
