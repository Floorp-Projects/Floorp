# SPDX-License-Identifier: MPL-2.0
name: Isolated Windows natural notification readiness diagnostic
on:
  push:
    branches: [codex/chrome-native-mac-crash-diagnostic]
    paths:
      - .github/workflows/chrome-native-windows-quiet-expiry-diagnostic.yml
      - .github/diagnostics/run-windows-quiet-expiry-diagnostic.py
permissions:
  contents: read
  actions: read
concurrency:
  group: chrome-native-windows-natural-readiness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 85
    steps:
      - name: Preserve exact Git LF source bytes in both isolated checkouts
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: b781ab6b56fb6e41bd87eeba91221230daebb579
          path: candidate-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: "v2.9.6"
      - name: Install exact frozen current candidate test dependencies
        working-directory: candidate-source
        run: deno install --frozen --allow-scripts
      - name: Observe natural Windows readiness before downloading or starting the candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .github/diagnostics/run-windows-quiet-expiry-diagnostic.py
          --source-root candidate-source --artifact quiet-expiry-artifact
          --application quiet-expiry-application --output quiet-expiry-output
      - name: Preserve every actual observation and unchanged headed test result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current393243-windows-natural-readiness-diagnostic
          if-no-files-found: warn
          path: |
            quiet-expiry-output/
            candidate-source/_dist/chrome-runtime-tests/windows-quiet-expiry/run-*/report.json
            candidate-source/_dist/chrome-runtime-tests/windows-quiet-expiry/run-*/browser.log
            candidate-source/_dist/chrome-runtime-tests/windows-quiet-expiry/run-*/modules/
            candidate-source/_dist/chrome-runtime-tests/windows-quiet-expiry/run-*/profile/user.js
            candidate-source/_dist/chrome-runtime-tests/windows-quiet-expiry/run-*/profile/compatibility.ini
