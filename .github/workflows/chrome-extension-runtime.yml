# SPDX-License-Identifier: MPL-2.0
name: Chrome extension native runtime candidate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/patches/floorp-runtime/common/chrome-*.patch"
      - ".github/workflows/chrome-extension-runtime.yml"
      - "floorp-runtime.lock.json"
      - "deno.lock"
      - "tools/chrome-extension-runtime/**"
      - "tools/src/*runtime_patch.test.ts"
      - "browser-features/modules/modules/chrome-web-store/**"
      - "browser-features/modules/actors/NRChromeWebStore*"
      - "browser-features/chrome/common/panel-sidebar/**"
      - "bridge/**"
permissions:
  contents: read
concurrency:
  group: chrome-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      runtime-repository: ${{ steps.identity.outputs.repository }}
      runtime-commit: ${{ steps.identity.outputs.commit }}
      build-id: ${{ steps.identity.outputs.build-id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - id: identity
        run: |
          python3 - <<'PY'
          import datetime,json,os,re
          lock=json.load(open('floorp-runtime.lock.json'))
          repo=lock['source']['repository'];commit=lock['source']['commit']
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',repo):
              raise ValueError('Invalid locked repository')
          if not re.fullmatch(r'[0-9a-f]{40}',commit):
              raise ValueError('Invalid locked commit')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'repository={repo}\ncommit={commit}\n')
              out.write('build-id='+datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d%H%M%S')+'\n')
          PY
  build:
    needs: identity
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            rust-target: x86_64-unknown-linux-gnu
          - platform: windows
            runner: ubuntu-24.04
            rust-target: x86_64-pc-windows-msvc
          - platform: mac
            runner: macos-26
            rust-target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ needs.identity.outputs.runtime-repository }}
          ref: ${{ needs.identity.outputs.runtime-commit }}
          path: _dist/runtime-base
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: "v2.9.6"
      - name: Frozen production dependencies
        run: deno install --frozen --allow-scripts
      - name: Linux cross build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools python3-dev libasound2-dev libpulse-dev libdbus-1-dev libgtk-3-dev libxt-dev xvfb
          # These are disposable hosted-runner SDKs, outside both checkouts.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
          sudo fallocate -l 8G /swapfile-floorp
          sudo chmod 600 /swapfile-floorp
          sudo mkswap /swapfile-floorp
          sudo swapon /swapfile-floorp
      - name: Exact Rust compiler and target
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup target add '${{ matrix.rust-target }}'
      - name: Native compiler content cache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a
      - name: Check maintained patches
        run: python3 tools/chrome-extension-runtime/check-patches.py --runtime-source _dist/runtime-base
      - name: Check actual production source composition
        run: >-
          python3 tools/chrome-extension-runtime/prepare-native-source.py
          --runtime-source _dist/runtime-base --production --check-only
      - name: Check incremental source safety and timestamp preservation
        run: python3 tools/chrome-extension-runtime/test-prepare-native-source.py
      - name: Check proxy ownership and private scope selection
        run: >-
          deno test --allow-read
          tools/src/proxy_runtime_patch.test.ts
          tools/src/proxy_scopes_runtime_patch.test.ts
      - name: Compile and package maintained native source
        env:
          CARGO_INCREMENTAL: "0"
          SCCACHE_GHA_ENABLED: "on"
        run: >-
          python3 tools/chrome-extension-runtime/ci/build-native.py
          --platform '${{ matrix.platform }}'
          --runtime-source _dist/runtime-base
          --build-id '${{ needs.identity.outputs.build-id }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrome-native-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            _dist/native-runtime/candidate-manifest.json
            _dist/native-runtime/obj/dist/floorp-*.zip
            _dist/native-runtime/obj/dist/floorp-*.tar.xz
            _dist/native-runtime/obj/dist/floorp-*.tar.gz
            _dist/native-runtime/obj/dist/floorp-*.dmg
      - name: Preserve native build provenance and configuration
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrome-native-build-${{ matrix.platform }}-diagnostics
          if-no-files-found: warn
          path: |
            _dist/native-runtime/applied-source.json
            _dist/native-runtime/mozconfig
            _dist/native-runtime/obj/config.log
            _dist/native-runtime/logs/*.log
            _dist/native-runtime/logs/host-resources.json
            _dist/native-runtime/source-patches-*/manifest.json

  native-api:
    if: ${{ always() && !cancelled() }}
    needs: build
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2025
          - platform: mac
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: "v2.9.6"
      - name: Frozen native test dependencies
        id: dependencies
        run: deno install --frozen --allow-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        id: candidate
        with:
          name: chrome-native-${{ matrix.platform }}
          path: _dist/downloaded-native-candidate
      - name: Linux native execution libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libpulse0 libdbus-1-3 libgtk-3-0t64 libxt6 pulseaudio pulseaudio-utils xvfb
      - name: Prepare real Linux audio output
        if: ${{ always() && runner.os == 'Linux' && steps.candidate.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/floorp-audio"
          chmod 700 "$RUNNER_TEMP/floorp-audio"
          pulseaudio --daemonize=yes --exit-idle-time=-1 \
            --log-target="file:$RUNNER_TEMP/floorp-audio/pulse.log" \
            --load="module-native-protocol-unix socket=$RUNNER_TEMP/floorp-audio/native auth-anonymous=1" \
            --load="module-null-sink sink_name=floorp_ci rate=48000 channels=2"
          export PULSE_SERVER="unix:$RUNNER_TEMP/floorp-audio/native"
          pactl set-default-sink floorp_ci
          pactl info
          echo "PULSE_SERVER=$PULSE_SERVER" >> "$GITHUB_ENV"
      - name: Prepare genuine Linux speech synthesis and measure its waveform
        if: ${{ always() && runner.os == 'Linux' && steps.candidate.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          sudo apt-get install -y speech-dispatcher speech-dispatcher-espeak-ng espeak-ng
          python tools/chrome-extension-runtime/ci/setup-linux-speech.py \
            --output "$RUNNER_TEMP/floorp-speech"
          mkdir -p _dist/chrome-runtime-tests/speech-backend
          cp "$RUNNER_TEMP/floorp-speech/backend.json" "$RUNNER_TEMP/floorp-speech/synthesis.wav" \
            _dist/chrome-runtime-tests/speech-backend/
      - name: Prepare real macOS CoreAudio output
        if: ${{ always() && runner.os == 'macOS' && steps.candidate.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          brew install --cask blackhole-2ch
          brew install switchaudio-osx
          sudo killall coreaudiod || true
          for attempt in {1..30}; do
            if SwitchAudioSource -a -t output | grep -Fx 'BlackHole 2ch'; then break; fi
            sleep 1
          done
          SwitchAudioSource -s 'BlackHole 2ch' -t output
          mkdir -p _dist/chrome-runtime-tests
          brew info --json=v2 blackhole-2ch > _dist/chrome-runtime-tests/coreaudio-backend.json
          system_profiler SPAudioDataType
      - name: Prepare signed real Windows audio output
        if: ${{ always() && runner.os == 'Windows' && steps.candidate.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        shell: pwsh
        run: ./tools/chrome-extension-runtime/ci/setup-windows-audio.ps1
      - name: Execute packaged production core and native APIs on the actual OS
        shell: bash
        run: >-
          python tools/chrome-extension-runtime/ci/test-candidate.py
          --platform '${{ matrix.platform }}'
          --artifact _dist/downloaded-native-candidate --group core
      - name: Measure actual native tab and desktop capture audio/video
        env:
          FLOORP_REQUIRE_NATIVE_CHROME_AUXILIARY: "1"
        if: ${{ always() && steps.candidate.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: >-
          python tools/chrome-extension-runtime/ci/test-candidate.py
          --platform '${{ matrix.platform }}'
          --artifact _dist/downloaded-native-candidate --group media
      - name: Preserve native execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrome-native-${{ matrix.platform }}-api-results
          if-no-files-found: warn
          path: |
            _dist/chrome-runtime-tests/
            _dist/side-panel-*/report.json
            _dist/diagnostics-*/report.json
