# SPDX-License-Identifier: MPL-2.0
name: Isolated Windows exact Chrome155 notification reference
on:
  push:
    branches: [codex/chrome-native-mac-crash-diagnostic]
    paths:
      - .github/workflows/chrome-native-windows-chrome155-notifications-reference.yml
      - .github/diagnostics/run-windows-chrome155-notifications.py
      - .github/diagnostics/chrome155-notifications-reference.mjs
      - .github/diagnostics/chrome155-notification-reference-types.ts
permissions:
  contents: read
concurrency:
  group: chrome-native-windows-chrome155-notifications-reference-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Preserve exact reviewed Git source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Observe exact installed-first Chrome DOC APIs and normal versus maximized UI
        run: >-
          python .github/diagnostics/run-windows-chrome155-notifications.py
          --output chrome155-notification-output --application chrome155-portable-application
          --vendor chrome155-official-vendor
      - name: Retain real public rows, OS and UI observations, sources and full owned profiles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-chrome155-notifications-reference
          include-hidden-files: true
          if-no-files-found: warn
          path: chrome155-notification-output/
