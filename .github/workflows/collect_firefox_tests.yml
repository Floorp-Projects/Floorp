# SPDX-License-Identifier: MPL-2.0

name: "(CI) Collect Firefox Tests"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-firefox-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Floorp
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/deno
          key: deno-firefox-tests-${{ hashFiles('deno.lock', 'floorp-runtime.lock.json') }}
          restore-keys: deno-firefox-tests-

      - run: deno install

      - name: Validate canonical Runtime lock
        run: deno run -A tools/runtime-lock/runtime_lock_cli.ts validate-lock

      - name: Read locked Runtime source
        id: runtime-lock
        shell: bash
        run: |
          set -euo pipefail
          repository="$(deno eval "const lock = JSON.parse(await Deno.readTextFile('floorp-runtime.lock.json')); console.log(lock.source.repository)")"
          ref="$(deno eval "const lock = JSON.parse(await Deno.readTextFile('floorp-runtime.lock.json')); console.log(lock.source.ref)")"
          commit="$(deno eval "const lock = JSON.parse(await Deno.readTextFile('floorp-runtime.lock.json')); console.log(lock.source.commit)")"
          tree="$(deno eval "const lock = JSON.parse(await Deno.readTextFile('floorp-runtime.lock.json')); console.log(lock.source.tree)")"
          {
            echo "repository=$repository"
            echo "ref=$ref"
            echo "commit=$commit"
            echo "tree=$tree"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout locked Floorp Runtime source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ steps.runtime-lock.outputs.repository }}
          ref: ${{ steps.runtime-lock.outputs.commit }}
          path: _dist/floorp-runtime
          fetch-depth: 1
          persist-credentials: false

      - name: Verify locked Runtime source identity
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ steps.runtime-lock.outputs.commit }}
          EXPECTED_TREE: ${{ steps.runtime-lock.outputs.tree }}
        run: |
          set -euo pipefail
          test "$(git -C _dist/floorp-runtime rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git -C _dist/floorp-runtime rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"

      - name: Verify Firefox test collector
        run: deno task test:firefox-tests

      - name: Collect Firefox tests
        env:
          RUNTIME_REF: ${{ steps.runtime-lock.outputs.ref }}
          RUNTIME_REPOSITORY: ${{ steps.runtime-lock.outputs.repository }}
        run: |
          deno task firefox-tests:collect \
            --runtime-dir _dist/floorp-runtime \
            --out _dist/firefox-tests \
            --source-repo "$RUNTIME_REPOSITORY" \
            --source-ref "$RUNTIME_REF"

      - name: Triage Firefox browser-chrome candidates
        run: deno task firefox-tests:triage-browser

      - name: Verify deterministic locked collection
        run: |
          deno eval '
            const lock = JSON.parse(await Deno.readTextFile("floorp-runtime.lock.json"));
            const manifest = JSON.parse(await Deno.readTextFile("_dist/firefox-tests/manifest.json"));
            if (manifest.mode !== "locked" || manifest.generatedAt !== undefined ||
              manifest.source.commit !== lock.source.commit ||
              manifest.source.tree !== lock.source.tree ||
              manifest.counts.files !== lock.source.materials.count ||
              manifest.counts.totalBytes !== lock.source.materials.totalBytes ||
              manifest.counts.candidates !== lock.source.tests.count) {
              throw new Error(`Locked collection projection mismatch: ${JSON.stringify(manifest)}`);
            }
          '

      - name: Upload Firefox test collection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firefox-tests-locked-browser-chrome
          path: _dist/firefox-tests
          if-no-files-found: error
          retention-days: 14
