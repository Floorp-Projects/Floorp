# SPDX-License-Identifier: MPL-2.0
name: Isolated old native Windows alert and XPI diagnostic
on:
  push:
    branches: [codex/chrome-native-mac-crash-diagnostic]
    paths:
      - .github/workflows/chrome-native-windows-old-diagnostic.yml
      - .github/diagnostics/run-windows-old-diagnostic.py
      - .github/diagnostics/observe-windows-alert-state.py
      - .github/diagnostics/windows-portable-scheduler-inputs.json
      - browser-features/modules/modules/chrome-web-store/test/ChromeExtensionUpdateScheduler.test.mts
      - browser-features/modules/modules/chrome-web-store/test/helpers/update-test-types.ts
permissions:
  contents: read
  actions: read
concurrency:
  group: chrome-native-old-windows-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Preserve exact Git LF source bytes in both isolated checkouts
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: f7ef0b832d79ed793b16421914d579307f76271c
          path: candidate-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: "v2.9.6"
      - name: Install exact frozen candidate test dependencies
        working-directory: candidate-source
        run: deno install --frozen --allow-scripts
      - name: Preserve exact old Windows artifact public metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path diagnostic-output | Out-Null
          gh api repos/Floorp-Projects/Floorp/actions/artifacts/12215177649 > diagnostic-output/artifact-metadata.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floorp-Projects/Floorp
          run-id: "39303630826"
          artifact-ids: "12215177649"
          github-token: ${{ github.token }}
          path: candidate-artifact
      - name: Observe original alerts and reviewed portable archive-integrity fixture
        run: >-
          python .github/diagnostics/run-windows-old-diagnostic.py
          --source-root candidate-source --artifact candidate-artifact
          --artifact-metadata diagnostic-output/artifact-metadata.json
          --output diagnostic-output/run
      - name: Retain actual old-product Windows diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: old393036-windows-alert-and-xpi-diagnostic
          if-no-files-found: warn
          path: |
            diagnostic-output/
            candidate-source/_dist/chrome-runtime-tests/windows-old-diagnostic/
            candidate-source/_dist/chrome-runtime-tests/windows-old-fixture/
