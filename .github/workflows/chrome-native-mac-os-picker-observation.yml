# SPDX-License-Identifier: MPL-2.0
name: Isolated authentic Mac OS picker observation
on:
  push:
    branches: [codex/chrome-native-mac-crash-diagnostic]
    paths:
      - .github/workflows/chrome-native-mac-os-picker-observation.yml
      - .github/diagnostics/run-mac-os-picker-observation.py
      - .github/diagnostics/observe-mac-os-picker.py
      - .github/diagnostics/mac-os-picker-snapshot.m
      - .github/diagnostics/mac-os-picker-stage-spec.json
permissions:
  contents: read
  actions: read
concurrency:
  group: chrome-native-mac-os-picker-observation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: b781ab6b56fb6e41bd87eeba91221230daebb579
          path: candidate-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: "v2.9.6"
      - name: Install exact frozen candidate test dependencies
        working-directory: candidate-source
        run: deno install --frozen --allow-scripts
      - name: Authenticate original package and observe one normal screen request
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .github/diagnostics/run-mac-os-picker-observation.py
          --source-root candidate-source
          --artifact mac-os-picker-observation-artifact
          --application mac-os-picker-observation-application
          --output mac-os-picker-observation-output
      - name: Retain actual OS observations and original screen result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authentic393243-mac-os-picker-observation
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            mac-os-picker-observation-output/
            candidate-source/_dist/chrome-runtime-tests/mac-os-picker-observation196/source/
            candidate-source/_dist/chrome-runtime-tests/mac-os-picker-observation196/**/report.json
            candidate-source/_dist/chrome-runtime-tests/mac-os-picker-observation196/**/browser.log
            candidate-source/_dist/chrome-runtime-tests/mac-os-picker-observation196/**/modules/
            candidate-source/_dist/chrome-runtime-tests/mac-os-picker-observation196/**/profile/user.js
            candidate-source/_dist/chrome-runtime-tests/mac-os-picker-observation196/**/profile/compatibility.ini
