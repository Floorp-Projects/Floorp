# SPDX-License-Identifier: MPL-2.0
name: QA3 macOS supervisor

"on":
  pull_request:
    paths:
      - "tools/qa3/**"
      - ".github/workflows/qa3-macos-supervisor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-supervisor:
    name: macos-supervisor / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon and Intel, as in the final package QA matrix.
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Report the macOS and Python runtimes
        run: |
          sw_vers
          uname -m
          python3 --version
          /usr/bin/python3 --version
      - name: Test the session supervisor with runner and system Python
        shell: bash
        run: |
          status=0
          for python in python3 /usr/bin/python3; do
            echo "Running supervisor contracts with $python"
            "$python" -B - <<'PY' || status=1
          import unittest

          suite = unittest.defaultTestLoader.discover("tools/qa3", "test_source_macos.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.testsRun or result.skipped:
              raise SystemExit("Expected the complete macOS suite without skips")
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
          done
          exit "$status"
