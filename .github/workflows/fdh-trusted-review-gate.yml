# SPDX-License-Identifier: MPL-2.0
# D-14 receipts are checked independently of the candidate tests and build.
name: FDH trusted review receipts
run-name: "FDH receipts for PR #${{ github.event.pull_request.number || github.event.issue.number }}"

"on":
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]

permissions: {}

jobs:
  refresh-receipts:
    # Only the pull_request_target run attaches the required Actions job to
    # the PR head. Rerun it on receipt changes, including removal after success.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, 'fdh-review-receipt:v1') ||
       contains(github.event.changes.body.from, 'fdh-review-receipt:v1'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      pull-requests: read
    concurrency:
      group: fdh-receipt-refresh-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Rerun trusted validation for this PR's current head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          if ! jq -e '.state == "open" and .base.ref == "main"' <<< "$pr" > /dev/null; then
            exit 0
          fi
          head_sha=$(jq -er '.head.sha | select(test("^[0-9a-f]{40}$"))' <<< "$pr")
          # Fork runs can have an empty pull_requests array. Use the run name
          # generated by this trusted workflow to identify the exact PR.
          run_title="FDH receipts for PR #${PR_NUMBER}"
          for _ in $(seq 1 60); do
            runs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/fdh-trusted-review-gate.yml/runs?event=pull_request_target&head_sha=${head_sha}&per_page=100")
            run_id=$(jq -r -s --arg title "$run_title" --arg sha "$head_sha" \
              '[.[].workflow_runs[] | select(.display_title == $title and .head_sha == $sha)][0] |
               select(.status == "completed") | .id' <<< "$runs")
            if [ -n "$run_id" ] && gh run rerun "$run_id" --repo "${GITHUB_REPOSITORY}"; then
              exit 0
            fi
            sleep 10
          done
          echo "Could not rerun trusted receipts for PR #${PR_NUMBER} at ${head_sha}. Reopen or update the PR if no trusted run exists yet." >&2
          exit 1

  trusted-receipts:
    name: trusted-receipt-publication
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: write
    concurrency:
      group: fdh-trusted-receipts-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout the main commit that supplied the workflow
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Deno without dependency installation
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x
      - name: Validate receipts and publish exact-head check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { spawn } = require("node:child_process");
            const [owner, repo] = (process.env.GITHUB_REPOSITORY || "").split("/");
            const childEnv = { PATH: process.env.PATH, DENO_NO_UPDATE_CHECK: "1" };
            for (const key of ["SystemRoot", "WINDIR"]) {
              if (process.env[key]) childEnv[key] = process.env[key];
            }
            const rawNumber = process.env.PR_NUMBER || "";
            const shaPattern = /^[0-9a-f]{40}$/;
            if (!owner || !repo || !/^[1-9][0-9]*$/.test(rawNumber) || !Number.isSafeInteger(Number(rawNumber))) {
              throw new Error("invalid repository or PR number");
            }
            const prNumber = Number(rawNumber);
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber });
            const headSha = process.env.EVENT_HEAD_SHA;
            if (pr.number !== prNumber || pr.state !== "open" || pr.base?.ref !== "main" ||
                !shaPattern.test(headSha || "") || headSha !== pr.head?.sha) {
              throw new Error("triggering head is no longer current on an open PR to main");
            }
            const { data: pending } = await github.rest.checks.create({
              ...context.repo, name: "fdh-trusted-receipts", head_sha: headSha,
              status: "in_progress", started_at: new Date().toISOString(),
              external_id: `fdh-trusted-receipts:${prNumber}:${headSha}`,
              output: { title: "FDH trusted receipts", summary: "Validating trusted PR receipts." },
            });
            let result;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: prNumber, per_page: 100 });
              const permissions = new Map();
              const inputs = [];
              for (const comment of comments) {
                const login = comment.user?.login;
                if (!login || !comment.body?.includes("fdh-review-receipt:v1") ||
                    !["OWNER", "MEMBER", "COLLABORATOR"].includes(comment.author_association)) continue;
                const key = login.toLowerCase();
                if (!permissions.has(key)) {
                  // The collaborator permission endpoint requires Metadata read,
                  // available to GITHUB_TOKEN without a separate credential.
                  let canWrite = false;
                  try {
                    const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username: login });
                    if (!["none", "read", "write", "admin"].includes(data.permission)) {
                      throw new Error("unexpected collaborator permission response");
                    }
                    canWrite = ["write", "admin"].includes(data.permission); // includes maintain (mapped to write)
                  } catch (error) {
                    if (error.status !== 404) throw error;
                  }
                  permissions.set(key, canWrite);
                }
                if (permissions.get(key)) {
                  inputs.push({ body: comment.body, author: login, authorAssociation: comment.author_association });
                } else {
                  console.log(`Ignoring receipt from ${login}: repository write access required`);
                }
              }
              const stdin = JSON.stringify({ prNumber, expectedHeadSha: headSha, currentHeadSha: headSha, comments: inputs });
              const child = spawn("deno", ["run", "--no-config", "--no-lock", "--quiet", "tools/src/fdh_trusted_review_runner.ts"], { stdio: ["pipe", "pipe", "pipe"], shell: false, windowsHide: true, env: childEnv });
              const out = []; const err = [];
              child.stdout.on("data", (chunk) => out.push(chunk));
              child.stderr.on("data", (chunk) => err.push(chunk));
              const code = await new Promise((resolve, reject) => { child.once("error", reject); child.once("close", resolve); child.stdin.end(stdin); });
              if (code !== 0) throw new Error(`trusted Deno checker exited ${code}: ${Buffer.concat(err).toString("utf8").slice(0, 500)}`);
              result = JSON.parse(Buffer.concat(out).toString("utf8"));
              if (result.name !== "fdh-trusted-receipts" || result.headSha !== headSha || !["success", "failure"].includes(result.conclusion)) throw new Error("trusted checker returned invalid output");
              const { data: latest } = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber });
              if (latest.head?.sha !== headSha || latest.state !== "open" || latest.base?.ref !== "main") {
                result = { name: "fdh-trusted-receipts", headSha, conclusion: "failure", summary: "PR head, state or base changed during receipt validation." };
              }
            } catch (error) {
              result = { name: "fdh-trusted-receipts", headSha, conclusion: "failure", summary: String(error instanceof Error ? error.message : "receipt validation failed").slice(0, 1000) };
            }
            await github.rest.checks.update({ ...context.repo, check_run_id: pending.id, status: "completed", completed_at: new Date().toISOString(), conclusion: result.conclusion, output: { title: "FDH trusted receipts", summary: result.summary } });
            console.log(`Published trusted receipt check on ${headSha}: ${result.conclusion}`);
            if (result.conclusion !== "success") {
              core.setFailed("Trusted receipt validation failed");
            }
