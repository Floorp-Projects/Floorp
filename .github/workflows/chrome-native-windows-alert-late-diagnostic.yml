# SPDX-License-Identifier: MPL-2.0
name: Isolated current Windows late alert and UTF8 diagnostics
on:
  push:
    branches: [codex/chrome-native-mac-crash-diagnostic]
    paths:
      - .github/workflows/chrome-native-windows-alert-late-diagnostic.yml
      - .github/diagnostics/run-windows-alert-late-diagnostic.py
      - .github/diagnostics/windows-alert-late-snapshot.sys.mts
permissions:
  contents: read
  actions: read
concurrency:
  group: chrome-native-windows-alert-late-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 85
    steps:
      - name: Preserve exact Git LF source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: b781ab6b56fb6e41bd87eeba91221230daebb579
          path: candidate-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: "v2.9.6"
      - name: Install exact frozen current candidate test dependencies
        working-directory: candidate-source
        run: deno install --frozen --allow-scripts
      - name: Observe only after original alert failure and run exact UTF8 UI fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .github/diagnostics/run-windows-alert-late-diagnostic.py
          --source-root candidate-source --artifact alert-late-artifact
          --application alert-late-application --output alert-late-output
      - name: Retain actual outcomes and original diagnostic source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current393243-windows-late-alert-diagnostic
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            alert-late-output/
            candidate-source/_dist/chrome-runtime-tests/windows-alert-late/
            candidate-source/_dist/diagnostics-ui-*/report.json
            candidate-source/_dist/diagnostics-ui-*/browser.log
            candidate-source/_dist/diagnostics-ui-*/profile/user.js
