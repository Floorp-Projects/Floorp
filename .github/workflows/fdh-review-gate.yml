# SPDX-License-Identifier: MPL-2.0

# Keep the required review-gate job for candidate tests and build.
# D-14 receipts are checked by the trusted-receipt-publication job instead.
name: "(CI) FDH Review Gate"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  review-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/deno
          key: deno-fdh-review-${{ hashFiles('deno.lock') }}
          restore-keys: deno-fdh-review-
      - run: deno install
      - name: Run host tool tests
        run: deno task test:host
      - name: Build (before-mach)
        run: deno task feles-build build --phase before-mach
