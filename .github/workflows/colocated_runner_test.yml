# SPDX-License-Identifier: MPL-2.0

name: "(CI) 🧪 Browser Integration + Runner Tests"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Smoke: lint / type check / test discovery (fast, no browser) ──
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/deno
          key: deno-smoke-${{ hashFiles('deno.lock', 'floorp-runtime.lock.json') }}
          restore-keys: deno-smoke-
      - run: deno install
      - name: Validate canonical Runtime lock
        run: deno run -A tools/runtime-lock/runtime_lock_cli.ts validate-lock
      - name: Validate locked Runtime release metadata
        if: github.event_name != 'pull_request'
        env:
          FLOORP_RUNTIME_GITHUB_TOKEN: ${{ secrets.PAT }}
        run: >-
          deno run -A tools/runtime-lock/runtime_lock_cli.ts
          validate-release-metadata
      - run: deno task test:smoke
      - name: Run host tool tests
        run: deno task test:host
      - name: Run locked Firefox test tooling tests
        run: deno task test:firefox-tests
      - name: Run Runtime lock CLI tests
        run: deno test --allow-read --allow-write tools/runtime-lock/

  # Every native Runtime asset is independently downloaded, authenticated,
  # extracted, and inspected. Only Linux x64 proceeds to executable browser CI.
  native-runtime:
    needs: smoke
    name: Native Runtime / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            architecture: x86_64
            browser_suite: true
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: aarch64
            browser_suite: false
          - runner: windows-latest
            platform: windows
            architecture: x86_64
            browser_suite: false
          - runner: macos-latest
            platform: macos
            architecture: universal
            browser_suite: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/deno
          key: deno-native-runtime-${{ matrix.runner }}-${{ hashFiles('deno.lock', 'floorp-runtime.lock.json') }}
          restore-keys: deno-native-runtime-${{ matrix.runner }}-

      - name: Cache locked Linux x64 browser Runtime
        if: matrix.browser_suite == true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: _dist/bin
          key: floorp-test-bin-${{ matrix.runner }}-${{ hashFiles('floorp-runtime.lock.json', 'tools/src/initializer.ts', 'tools/src/runtime_lock.ts') }}

      - run: deno install

      - name: Validate canonical Runtime lock
        run: deno run -A tools/runtime-lock/runtime_lock_cli.ts validate-lock

      - name: Validate locked native Runtime artifact
        if: matrix.browser_suite != true
        run: >-
          deno run -A tools/runtime-lock/runtime_lock_cli.ts
          validate-native --out _dist/runtime-validation

      - name: Verify macOS G5 lifecycle helper foundation
        if: matrix.platform == 'macos'
        run: >-
          deno test --allow-read --allow-write --allow-run
          tools/native/tests/g5_macos_lifecycle_helper.test.ts

      - name: Install locked Runtime for browser suite
        if: matrix.browser_suite == true
        run: >-
          deno run -A tools/runtime-lock/runtime_lock_cli.ts
          install-native

      - name: Read locked Runtime source
        if: matrix.browser_suite == true
        id: runtime-lock
        shell: bash
        run: |
          set -euo pipefail
          repository="$(deno eval "const lock = JSON.parse(await Deno.readTextFile('floorp-runtime.lock.json')); console.log(lock.source.repository)")"
          ref="$(deno eval "const lock = JSON.parse(await Deno.readTextFile('floorp-runtime.lock.json')); console.log(lock.source.ref)")"
          commit="$(deno eval "const lock = JSON.parse(await Deno.readTextFile('floorp-runtime.lock.json')); console.log(lock.source.commit)")"
          tree="$(deno eval "const lock = JSON.parse(await Deno.readTextFile('floorp-runtime.lock.json')); console.log(lock.source.tree)")"
          {
            echo "repository=$repository"
            echo "ref=$ref"
            echo "commit=$commit"
            echo "tree=$tree"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout locked Floorp Runtime source
        if: matrix.browser_suite == true
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ steps.runtime-lock.outputs.repository }}
          ref: ${{ steps.runtime-lock.outputs.commit }}
          path: _dist/floorp-runtime
          fetch-depth: 1
          persist-credentials: false

      - name: Verify locked Runtime source identity
        if: matrix.browser_suite == true
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ steps.runtime-lock.outputs.commit }}
          EXPECTED_TREE: ${{ steps.runtime-lock.outputs.tree }}
        run: |
          set -euo pipefail
          test "$(git -C _dist/floorp-runtime rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git -C _dist/floorp-runtime rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"

      - name: Collect locked Firefox browser tests
        if: matrix.browser_suite == true
        shell: bash
        env:
          RUNTIME_REF: ${{ steps.runtime-lock.outputs.ref }}
          RUNTIME_REPOSITORY: ${{ steps.runtime-lock.outputs.repository }}
        run: |
          set -euo pipefail
          deno task firefox-tests:collect \
            --runtime-dir _dist/floorp-runtime \
            --out _dist/firefox-tests \
            --source-repo "$RUNTIME_REPOSITORY" \
            --source-ref "$RUNTIME_REF"

      - name: Triage locked Firefox browser tests
        if: matrix.browser_suite == true
        run: deno task firefox-tests:triage-browser

      - name: Prepare locked Firefox browser test wrappers
        if: matrix.browser_suite == true
        run: deno task firefox-tests:prepare-browser

      - name: Verify generated wrappers exist before browser startup
        if: matrix.browser_suite == true
        shell: bash
        run: |
          set -euo pipefail
          test -s browser-features/chrome/test/firefox-downloaded/generated/manifest.json
          deno eval '
            const generatedRoot =
              "browser-features/chrome/test/firefox-downloaded/generated";
            const [manifest, lock] = await Promise.all([
              Deno.readTextFile(`${generatedRoot}/manifest.json`).then(JSON.parse),
              Deno.readTextFile("floorp-runtime.lock.json").then(JSON.parse),
            ]);
            const expectedFileCount = lock.source.tests.count;
            const expectedTaskCount = lock.source.tests.totalTasks;
            if (manifest.schemaVersion !== 1 ||
              manifest.tests?.length !== expectedFileCount) {
              throw new Error(
                `Expected generated manifest schema 1 with exactly ${expectedFileCount} wrappers`,
              );
            }
            const taskCount = manifest.tests.reduce(
              (sum, test) => sum + test.expectedTaskCount,
              0,
            );
            if (taskCount !== expectedTaskCount) {
              throw new Error(
                `Expected ${expectedTaskCount} locked tasks, got ${taskCount}`,
              );
            }
            for (const test of manifest.tests) {
              if (!test.upstreamPath || !test.manifestPath || !test.wrapperPath ||
                !test.importSpecifier || !Array.isArray(test.prefs) ||
                test.headPolicy !== "harness-replaced" ||
                test.supportPolicy !== "locked-not-loaded") {
                throw new Error(`Incomplete locked wrapper marker: ${JSON.stringify(test)}`);
              }
              for (const pref of test.prefs) {
                const typed = typeof pref.name === "string" && (
                  (pref.kind === "bool" && typeof pref.value === "boolean") ||
                  (pref.kind === "int" && Number.isInteger(pref.value)) ||
                  (pref.kind === "string" && typeof pref.value === "string")
                );
                if (!typed) throw new Error(`Invalid typed preference: ${JSON.stringify(pref)}`);
              }
              const info = await Deno.stat(`${generatedRoot}/${test.wrapperPath}`);
              if (!info.isFile) throw new Error(`Missing wrapper: ${test.wrapperPath}`);
            }
            let wrapperFileCount = 0;
            for await (const entry of Deno.readDir(generatedRoot)) {
              if (entry.isFile && entry.name.endsWith(".test.js")) {
                wrapperFileCount += 1;
              }
            }
            if (wrapperFileCount !== expectedFileCount) {
              throw new Error(
                `Expected ${expectedFileCount} generated wrapper files, got ${wrapperFileCount}`,
              );
            }
          '

      - name: Set up virtual display
        if: matrix.browser_suite == true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool
          export DISPLAY=:99
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1280x1024x24 &
          for i in {1..50}; do
            if xdotool getdisplaygeometry >/dev/null 2>&1; then
              break
            fi
            sleep 0.1
          done
          xdotool getdisplaygeometry
          xdotool version

      - name: Run combined browser test suite against locked Runtime
        if: matrix.browser_suite == true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _dist _dist/profile/test
          rm -f \
            _dist/marionette-port.txt \
            _dist/profile/test/nora-tests-control.json \
            logs/test/latest.log

          deno task test \
            --layer all \
            --timeout-ms 1800000 \
            --startup-timeout-ms 180000 \
            --no-autostart \
            > _dist/ci-combined-browser-test.log 2>&1 &
          TEST_PID=$!

          kill_process_tree() {
            local root_pid="$1"
            local all_pids="$root_pid"
            local queue="$root_pid"

            while [[ -n "$queue" ]]; do
              local next_queue=""
              for pid in $queue; do
                local children
                children="$(pgrep -P "$pid" || true)"
                if [[ -n "$children" ]]; then
                  all_pids="$all_pids $children"
                  next_queue="$next_queue $children"
                fi
              done
              queue="$next_queue"
            done

            kill $all_pids >/dev/null 2>&1 || true
            sleep 5
            kill -9 $all_pids >/dev/null 2>&1 || true
          }

          cleanup() {
            if kill -0 "$TEST_PID" >/dev/null 2>&1; then
              kill "$TEST_PID" >/dev/null 2>&1 || true
            fi

            if [[ "${FELES_PID:-}" != "" ]] && kill -0 "$FELES_PID" >/dev/null 2>&1; then
              kill_process_tree "$FELES_PID"
            fi
          }
          trap cleanup EXIT

          for i in {1..60}; do
            if [[ -s _dist/profile/test/nora-tests-control.json ]]; then
              break
            fi

            if ! kill -0 "$TEST_PID" >/dev/null 2>&1; then
              cat _dist/ci-combined-browser-test.log || true
              wait "$TEST_PID"
            fi

            sleep 1
          done

          if [[ ! -s _dist/profile/test/nora-tests-control.json ]]; then
            echo "::error::Combined test control prefs were not written"
            cat _dist/ci-combined-browser-test.log || true
            exit 1
          fi

          deno task feles-build test > _dist/ci-feles-build-test.log 2>&1 &
          FELES_PID=$!

          for i in {1..300}; do
            if [[ -s _dist/marionette-port.txt ]]; then
              echo "Marionette ready on port $(cat _dist/marionette-port.txt)"
              break
            fi

            if ! kill -0 "$FELES_PID" >/dev/null 2>&1; then
              echo "::error::feles-build test exited before Marionette became ready"
              cat _dist/ci-feles-build-test.log || true
              exit 1
            fi

            sleep 2
          done

          if [[ ! -s _dist/marionette-port.txt ]]; then
            echo "::error::Marionette startup timed out"
            cat _dist/ci-feles-build-test.log || true
            exit 1
          fi

          wait "$TEST_PID"
          deno run \
            --allow-net=127.0.0.1 \
            --allow-read=_dist \
            tools/src/mouse_gesture_rocker_w3c_e2e.ts
          deno run \
            --allow-net=127.0.0.1 \
            --allow-read=_dist \
            tools/src/mouse_gesture_drawn_w3c_e2e.ts
          deno run \
            --allow-net=127.0.0.1 \
            --allow-read=_dist \
            --allow-run=xdotool \
            tools/src/mouse_gesture_wheel_x11_e2e.ts

      - name: Verify downloaded Firefox execution coverage
        if: matrix.browser_suite == true
        shell: bash
        run: |
          set -euo pipefail
          test -s logs/test/latest.log
          deno eval '
            const [log, lock] = await Promise.all([
              Deno.readTextFile("logs/test/latest.log"),
              Deno.readTextFile("floorp-runtime.lock.json").then(JSON.parse),
            ]);
            const expectedFileCount = lock.source.tests.count;
            const expectedTaskCount = lock.source.tests.totalTasks;
            const coverage = [...log.matchAll(
              /^\[[^\r\n]+\] \[INFO\] Downloaded Firefox coverage: (\d+) file\(s\), (\d+) task\(s\), (\d+) passed$/gm,
            )];
            if (coverage.length !== 1) {
              throw new Error(
                `Expected exactly one downloaded Firefox coverage result, got ${coverage.length}`,
              );
            }
            const [fileCount, taskCount, passedTaskCount] = coverage[0]
              .slice(1, 4)
              .map(Number);
            if (fileCount !== expectedFileCount ||
              taskCount !== expectedTaskCount ||
              passedTaskCount !== expectedTaskCount) {
              throw new Error(
                `Expected executed coverage ${expectedFileCount} files / ${expectedTaskCount} tasks / ${expectedTaskCount} passed, got ${fileCount} files / ${taskCount} tasks / ${passedTaskCount} passed`,
              );
            }
            const exitCodes = log.match(/^\[META\] exitCode=.*$/gm) ?? [];
            if (exitCodes.length !== 1 || exitCodes[0] !== "[META] exitCode=0") {
              throw new Error(
                `Expected one successful runner exit record, got ${JSON.stringify(exitCodes)}`,
              );
            }
          '

      - name: Run runner unit tests
        if: matrix.browser_suite == true
        run: deno test -A tools/src/colocated_test_runner.test.ts

      - name: Upload logs on failure
        if: failure() && matrix.browser_suite == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-logs-${{ matrix.runner }}
          path: |
            logs/test/latest.log
            _dist/ci-combined-browser-test.log
            _dist/ci-feles-build-test.log
            logs/vite-*.log
            _dist/firefox-tests/SUMMARY.md
            _dist/firefox-tests/TRIAGE.md
            _dist/firefox-tests/triage.json
            browser-features/chrome/test/firefox-downloaded/generated/manifest.json
