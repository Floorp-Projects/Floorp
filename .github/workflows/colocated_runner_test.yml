# SPDX-License-Identifier: MPL-2.0

name: "(CI) 🧪 Browser Integration + Runner Tests"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FIREFOX_TEST_RUNTIME_REPOSITORY: Floorp-Projects/Floorp-Runtime
  FIREFOX_TEST_RUNTIME_REF: nora-0.2.0

jobs:
  # ── Smoke: lint / type check / test discovery (fast, no browser) ──
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ hashFiles('deno.lock') }}
          restore-keys: deno-
      - run: deno install
      - run: deno task test:smoke

  # ── Browser integration tests (requires smoke to pass) ──
  browser-integration:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout Floorp Runtime for downloaded Firefox tests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FIREFOX_TEST_RUNTIME_REPOSITORY }}
          ref: ${{ env.FIREFOX_TEST_RUNTIME_REF }}
          path: _dist/floorp-runtime
          fetch-depth: 1
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ hashFiles('deno.lock') }}
          restore-keys: deno-
      - uses: actions/cache@v4
        with:
          path: _dist/bin
          key: floorp-test-bin-linux-${{ hashFiles('tools/src/defines.ts') }}
          restore-keys: floorp-test-bin-linux-

      - name: Set up virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1280x1024x24 &

      - name: Start browser and run integration tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _dist
          rm -f _dist/marionette-port.txt

          deno install
          deno task feles-build test > _dist/ci-feles-build-test.log 2>&1 &
          FELES_PID=$!

          kill_process_tree() {
            local root_pid="$1"
            local all_pids="$root_pid"
            local queue="$root_pid"

            while [[ -n "$queue" ]]; do
              local next_queue=""
              for pid in $queue; do
                local children
                children="$(pgrep -P "$pid" || true)"
                if [[ -n "$children" ]]; then
                  all_pids="$all_pids $children"
                  next_queue="$next_queue $children"
                fi
              done
              queue="$next_queue"
            done

            kill $all_pids >/dev/null 2>&1 || true
            sleep 5
            kill -9 $all_pids >/dev/null 2>&1 || true
          }

          cleanup() {
            if kill -0 "$FELES_PID" >/dev/null 2>&1; then
              kill_process_tree "$FELES_PID"
            fi
          }
          trap cleanup EXIT

          for i in {1..300}; do
            if [[ -s _dist/marionette-port.txt ]]; then
              echo "Marionette ready on port $(cat _dist/marionette-port.txt)"
              break
            fi
            sleep 2
          done

          if [[ ! -s _dist/marionette-port.txt ]]; then
            echo "::error::Marionette startup timed out"
            cat _dist/ci-feles-build-test.log || true
            exit 1
          fi

          deno task test --no-autostart

      - name: Collect downloaded Firefox browser tests
        run: |
          deno task firefox-tests:collect \
            --runtime-dir _dist/floorp-runtime \
            --out _dist/firefox-tests \
            --scope browser-chrome \
            --source-repo "$FIREFOX_TEST_RUNTIME_REPOSITORY" \
            --source-ref "$FIREFOX_TEST_RUNTIME_REF"

      - name: Triage downloaded Firefox browser tests
        run: deno task firefox-tests:triage-browser

      - name: Prepare downloaded Firefox browser test wrappers
        run: deno task firefox-tests:prepare-browser

      - name: Run downloaded Firefox browser tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _dist _dist/profile/test
          rm -f _dist/marionette-port.txt _dist/profile/test/nora-tests-control.json

          deno task test \
            --no-autostart \
            --near browser-features/chrome/test/firefox-downloaded/generated \
            --layer chrome \
            > _dist/ci-downloaded-firefox-test.log 2>&1 &
          TEST_PID=$!

          kill_process_tree() {
            local root_pid="$1"
            local all_pids="$root_pid"
            local queue="$root_pid"

            while [[ -n "$queue" ]]; do
              local next_queue=""
              for pid in $queue; do
                local children
                children="$(pgrep -P "$pid" || true)"
                if [[ -n "$children" ]]; then
                  all_pids="$all_pids $children"
                  next_queue="$next_queue $children"
                fi
              done
              queue="$next_queue"
            done

            kill $all_pids >/dev/null 2>&1 || true
            sleep 5
            kill -9 $all_pids >/dev/null 2>&1 || true
          }

          cleanup() {
            if kill -0 "$TEST_PID" >/dev/null 2>&1; then
              kill "$TEST_PID" >/dev/null 2>&1 || true
            fi

            if [[ "${FELES_PID:-}" != "" ]] && kill -0 "$FELES_PID" >/dev/null 2>&1; then
              kill_process_tree "$FELES_PID"
            fi
          }
          trap cleanup EXIT

          for i in {1..60}; do
            if [[ -s _dist/profile/test/nora-tests-control.json ]]; then
              break
            fi

            if ! kill -0 "$TEST_PID" >/dev/null 2>&1; then
              cat _dist/ci-downloaded-firefox-test.log || true
              wait "$TEST_PID"
            fi

            sleep 1
          done

          if [[ ! -s _dist/profile/test/nora-tests-control.json ]]; then
            echo "::error::Downloaded Firefox test control prefs were not written"
            cat _dist/ci-downloaded-firefox-test.log || true
            exit 1
          fi

          deno task feles-build test > _dist/ci-downloaded-firefox-feles-build-test.log 2>&1 &
          FELES_PID=$!

          for i in {1..300}; do
            if [[ -s _dist/marionette-port.txt ]]; then
              echo "Marionette ready on port $(cat _dist/marionette-port.txt)"
              break
            fi

            if ! kill -0 "$FELES_PID" >/dev/null 2>&1; then
              echo "::error::feles-build test exited before Marionette became ready"
              cat _dist/ci-downloaded-firefox-feles-build-test.log || true
              exit 1
            fi

            sleep 2
          done

          if [[ ! -s _dist/marionette-port.txt ]]; then
            echo "::error::Marionette startup timed out"
            cat _dist/ci-downloaded-firefox-feles-build-test.log || true
            exit 1
          fi

          wait "$TEST_PID"

      - name: Run runner unit tests
        run: deno test -A tools/src/colocated_test_runner.test.ts

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            logs/test/latest.log
            _dist/ci-feles-build-test.log
            _dist/ci-downloaded-firefox-test.log
            _dist/ci-downloaded-firefox-feles-build-test.log
            logs/vite-*.log
            _dist/firefox-tests/SUMMARY.md
            _dist/firefox-tests/TRIAGE.md
            _dist/firefox-tests/triage.json
            browser-features/chrome/test/firefox-downloaded/generated/manifest.json
